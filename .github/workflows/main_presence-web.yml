# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - presence-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:  
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49BBB3765B034ECB886D8F91037D1DAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CDA090B7ADF48D5A599B305BA0D5111 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E0D4DF8A03684B01951BA5ACAF7C550F }}
      - name: Install Cloudflared
        run: |
          echo "--- Installing Cloudflared ---"
          mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null

          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list

          # install cloudflared
          apt-get update && sudo apt-get install -y cloudflared
          cloudflared service install eyJhIjoiZWUxYmVhNjJhNjdlMWM0NzdlZjYyNWI0ZTBiZDI3NGYiLCJ0IjoiYThmNDRjMGItMWUzYy00MGY4LWIyMWYtMzg4N2Q4MjdlNGFjIiwicyI6Ik1qSmpNalpsTVRjdFl6ZGhOeTAwTUdZNUxXRTBabUV0WW1JelpXRmpOelJtWWpNMCJ9
          echo "--- Cloudflared Installation Complete ---"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'presence-web'
          slot-name: 'Production'
          package: .
          